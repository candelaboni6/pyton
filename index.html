<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de contenido - Clínica Santa María - Junio 2026</title>
    <style>
        :root {
            --color-primary: #1B4965;
            --color-accent: #62B6CB;
            --color-soft: #BEE9E8;
            --color-text: #1A2238;
            --color-gray: #5D6B7E;
            --color-light-bg: #F4F7FA;
            --color-placa-bg: #EAF4F4;
            --color-cta: #E76F51;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--color-text);
            line-height: 1.6;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        /* Portada */
        .cover {
            text-align: center;
            padding: 60px 0;
            border-bottom: 2px solid var(--color-soft);
            margin-bottom: 40px;
        }
        .cover h1 {
            font-size: 36px;
            color: var(--color-primary);
            margin: 10px 0;
            font-weight: 700;
        }
        .cover .subtitle {
            font-size: 18px;
            color: var(--color-gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        .cover .tagline {
            font-style: italic;
            color: var(--color-accent);
            font-size: 14px;
            margin-top: 5px;
        }
        .cover-divider {
            width: 100px;
            height: 4px;
            background-color: var(--color-cta);
            margin: 25px auto;
        }
        .cover-info {
            width: 100%;
            margin-top: 40px;
            border-collapse: collapse;
            background-color: var(--color-light-bg);
            text-align: left;
        }
